name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "macos/TrainingPython/**", "macos/hollow-knight-input-receiver/**", "models/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "macos/TrainingPython/**", "macos/hollow-knight-input-receiver/**", "models/**", ".github/workflows/windows.yml"]

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test Windows app
        run: .\build-windows.ps1 -Configuration Release
      - name: Install training dependencies
        run: .\setup-training-windows.ps1
      - name: Publish
        run: dotnet publish src/HollowKnightVision.Windows.App/HollowKnightVision.Windows.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: HollowKnightVision-Windows
          path: windows/artifacts/publish
