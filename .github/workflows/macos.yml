name: macOS

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path macos
      - name: Python unit tests
        run: |
          python3 macos/test-analyze-input-paths.py
          python3 macos/test-camera-diagnostics.py
