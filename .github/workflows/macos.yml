name: macOS

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Portable Swift tests
        run: swift test --package-path macos --enable-code-coverage
      - name: Upload measured Swift coverage
        if: always()
        run: |
          mkdir -p coverage
          coverage_json="$(swift test --package-path macos --enable-code-coverage --show-codecov-path)"
          test -s "$coverage_json"
          cp "$coverage_json" coverage/swift-coverage.json
          python3 macos/report-gpu-coverage.py coverage/swift-coverage.json coverage/gpu-coverage.json
      - name: Publish measured Swift coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HollowKnightVision-macOS-coverage
          path: coverage/
          if-no-files-found: error
      - name: Build macOS app bundle
        env:
          HKV_CODE_SIGN_IDENTITY: "-"
        run: macos/build-app.sh --package-only

  python-coverage:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: diagnostics
          - suite: bot
            requirements: macos/BotPython/requirements.txt
          - suite: object
            requirements: macos/TrainingPython/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coverage and suite dependencies
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m pip install 'coverage==7.10.7'
          if [[ -n "$REQUIREMENTS" ]]; then python -m pip install -r "$REQUIREMENTS"; fi
      - name: Measure line and branch coverage
        run: bash macos/measure-python-coverage.sh "${{ matrix.suite }}" "coverage/${{ matrix.suite }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: HollowKnightVision-macOS-python-${{ matrix.suite }}
          path: coverage/${{ matrix.suite }}.json
          if-no-files-found: error
