name: macOS

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Portable Swift tests
        # MenuStencilTests audit a user-generated local screenshot/calibration
        # corpus. The standalone repository intentionally does not distribute it.
        run: swift test --package-path macos --enable-code-coverage --skip MenuStencilTests
      - name: Upload measured Swift coverage
        if: always()
        run: |
          mkdir -p coverage
          coverage_json="$(swift test --package-path macos --enable-code-coverage --show-codecov-path)"
          test -s "$coverage_json"
          cp "$coverage_json" coverage/swift-coverage.json
          python3 macos/report-gpu-coverage.py coverage/swift-coverage.json coverage/gpu-coverage.json
      - name: Publish measured Swift coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HollowKnightVision-macOS-coverage
          path: coverage/
          if-no-files-found: error
      - name: Python unit tests
        run: |
          python3 macos/test-analyze-input-paths.py
          python3 macos/test-camera-diagnostics.py
          python3 macos/test-report-gpu-coverage.py
      - name: Build macOS app bundle
        env:
          HKV_CODE_SIGN_IDENTITY: "-"
        run: macos/build-app.sh --package-only
